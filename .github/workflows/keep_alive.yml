name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '*/20 * * * *'  # 20분마다 실행
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            https://delay-compensation-adh2metcwpfyrvnx4kbtzq.streamlit.app/ || true
